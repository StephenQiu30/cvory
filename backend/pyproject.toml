[project]
name = "cvory-backend"
version = "0.2.0"
description = "CVory (简序) FastAPI backend service"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=4.0.0",
    "asyncpg>=0.30.0",
    "boto3>=1.37.0",
    "fastapi>=0.115.0",
    "pillow>=11.1.0",
    "playwright>=1.51.0",
    "pydantic[email]>=2.11.0",
    "pydantic-settings>=2.8.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "pyright>=1.1.398",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
