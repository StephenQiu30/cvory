name: cvory

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      BACKEND_PORT: "3001"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://127.0.0.1:3000}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://cvory:cvory_dev_password@host.docker.internal:5432/cvory?schema=public}"
      REDIS_URL: "${REDIS_URL:-redis://host.docker.internal:6379}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars}"
      JWT_ACCESS_EXPIRES_IN: "${JWT_ACCESS_EXPIRES_IN:-15m}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-14d}"
      SMTP_HOST: "${SMTP_HOST:-smtp.163.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-简序 CVory <no-reply@163.com>}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:3001/api}"
        NEXT_PUBLIC_WS_SYNC_URL: "${NEXT_PUBLIC_WS_SYNC_URL:-ws://127.0.0.1:3001/ws/sync}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  workspace:
    build:
      context: ./workspace
      args:
        WORKSPACE_PUBLIC_URL: "${WORKSPACE_PUBLIC_URL:-http://127.0.0.1:${WORKSPACE_PORT:-1230}}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKSPACE_PORT:-1230}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/docs').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
