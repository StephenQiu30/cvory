services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cvory-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4321}:4321"
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-cvory}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@${MYSQL_HOST:-host.docker.internal}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-cvory}"
      PORT: "4321"
      PUBLIC_APP_ORIGIN: "${PUBLIC_APP_ORIGIN:-http://localhost:1234}"
      FRONTEND_INTERNAL_URL: http://frontend:1234
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      LEGACY_REGISTRATION_ENABLED: "${LEGACY_REGISTRATION_ENABLED:-false}"
      DELETION_ENABLED: "${DELETION_ENABLED:-false}"
      CV_HISTORY_LIMIT: "${CV_HISTORY_LIMIT:-50}"
      DATA_DIR: /app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvory-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-1234}:1234"
    environment:
      NODE_ENV: production
      PORT: "1234"
      BACKEND_INTERNAL_URL: http://backend:4321
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  backend-data:
