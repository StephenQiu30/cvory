name: cvory

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      BACKEND_PORT: "3001"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://127.0.0.1:3000}"
      FRONTEND_INTERNAL_URL: "${FRONTEND_INTERNAL_URL:-http://frontend:3000}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://cvory:cvory_dev_password@host.docker.internal:5432/cvory}"
      REDIS_URL: "${REDIS_URL:-redis://host.docker.internal:6379/0}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars}"
      JWT_ACCESS_EXPIRES_MINUTES: "${JWT_ACCESS_EXPIRES_MINUTES:-15}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars}"
      JWT_REFRESH_EXPIRES_DAYS: "${JWT_REFRESH_EXPIRES_DAYS:-14}"
      SMTP_HOST: "${SMTP_HOST:-smtp.163.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-简序 CVory <no-reply@163.com>}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://host.docker.internal:9000}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-cvory-avatars}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_PUBLIC_BASE_URL: "${S3_PUBLIC_BASE_URL:-http://127.0.0.1:9000/cvory-avatars}"
      PDF_MAX_CONCURRENCY: "${PDF_MAX_CONCURRENCY:-2}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:3001/api/health', timeout=3); sys.exit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:3001/api}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  workspace:
    build:
      context: ./workspace
      args:
        WORKSPACE_PUBLIC_URL: "${WORKSPACE_PUBLIC_URL:-http://127.0.0.1:${WORKSPACE_PORT:-1230}}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKSPACE_PORT:-1230}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/docs').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
